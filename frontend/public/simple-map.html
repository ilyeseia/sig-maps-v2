<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIG Maps - Simple Test</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }
    #debug { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.9); color: white; padding: 10px; max-height: 200px; overflow: auto; font-family: monospace; font-size: 12px; z-index: 9999; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="debug">
    <strong>🔍 Debug Console:</strong>
    <pre id="output">جاري التحميل...</pre>
  </div>

  <script>
    const output = document.getElementById('output');

    function log(msg) {
      output.innerHTML += '\n' + msg;
      console.log(msg);
    }

    log('1. بدء التحميل...');

    // Load Leaflet from CDN (inline to avoid module issues)
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    script.onload = function() {
      log('2. ✅ Leaflet محملة!');

      if (typeof L === 'undefined') {
        log('❌ L غير موجود!');
        return;
      }

      try {
        // Initialize map
        const map = L.map('map', {
          center: [36.7538, 3.0588],
          zoom: 12,
          zoomControl: true
        });

        log('3. ✅ Map initialized');

        // Add tile layer
        const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap',
          maxZoom: 19
        });

        tileLayer.addTo(map);
        log('4. ✅ Tile layer added');

        // Add a sample marker
        const marker = L.marker([36.7538, 3.0588]).addTo(map);
        marker.bindPopup('الجزائر العاصمة<br>Algiers').openPopup();
        log('5. ✅ Marker added');

        // Test API
        log('\n6. اختبار API...');

        // Get token from localStorage
        const token = localStorage.getItem('accessToken');
        if (token) {
          log('   ✅ Token موجود: ' + token.substring(0, 50) + '...');

          // Test API call
          fetch('/api/features?limit=5', {
            headers: {
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json'
            }
          })
          .then(r => r.json())
          .then(data => {
            const features = data.features || [];
            log('   ✅ API Response: ' + features.length + ' features');

            // Add features to map
            features.forEach((feature, i) => {
              if (feature.geometry && feature.attributes) {
                try {
                  const geojson = L.geoJSON(feature.geometry, {
                    pointToLayer: function(feature, latlng) {
                      return L.circleMarker(latlng, {
                        radius: 8,
                        fillColor: '#ef4444',
                        color: '#fff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                      });
                    }
                  }).addTo(map);

                  geojson.bindPopup(
                    `<strong>${feature.attributes.name_ar || 'Feature ' + i}</strong><br>` +
                    `${feature.attributes.name_fr || ''}`
                  );
                  log('   ✅ Feature ' + i + ' added to map');
                } catch(err) {
                  log('   ⚠️  Feature ' + i + ' error: ' + err.message);
                }
              }
            });
            log('\n✅ كل شيء يعمل!');
          })
          .catch(err => {
            log('   ❌ API Error: ' + err.message);
            log('   Tip: تأكد من تسجيل الدخول أولاً على /login');
          });
        } else {
          log('   ⚠️  Token غير موجود!');
          log('   افتح /login ثم عد');
        }

      } catch (err) {
        log('❌ خطأ في الخريطة: ' + err.message);
        log(err.stack);
      }
    };

    script.onerror = function() {
      log('❌ فشل تحميل Leaflet!');
    };

    document.head.appendChild(script);
  </script>
</body>
</html>
