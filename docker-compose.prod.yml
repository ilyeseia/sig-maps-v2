version: '3.8'

services:
  # PostgreSQL Database with PostGIS
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: sig-maps-postgres-prod
    restart: unless-stopped
    env_file:
      - .env.production
    command: >
      postgres -c max_connections=100
               -c shared_buffers=256MB
               -c effective_cache_size=1GB
               -c work_mem=4MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c random_page_cost=1.1
               -c effective_io_concurrency=200
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigmaps_prod_user -d sig_maps_v2"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sig-maps-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for BullMQ (Export Jobs)
  redis:
    image: redis:7-alpine
    container_name: sig-maps-redis-prod
    restart: unless-stopped
    env_file:
      - .env.production
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --timeout 300
        --save 900 1
        --save 300 10
        --save 60 10000
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sig-maps-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API (Production Build)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sig-maps-backend-prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3005
    ports:
      - 3005:3005
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "sig-backend-prod"
      tsdproxy.container_port: "3005"
      tsdproxy.funnel: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - exports_volume_prod:/app/exports
      - prisma_migrations_prod:/app/prisma/migrations
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sig-maps-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend (Next.js Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sig-maps-frontend-prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    ports:
      - 3003:3000
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "sig-frontend-prod"
      tsdproxy.container_port: "3000"
      tsdproxy.funnel: "true"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sig-maps-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sig-maps-nginx-prod
    restart: unless-stopped
    ports:
      - 8080:80
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "sig-maps"
      tsdproxy.container_port: "80"
      tsdproxy.funnel: "true"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sig-maps-prod-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  postgres_data_prod:
  exports_volume_prod:
  prisma_migrations_prod:
  redis_data_prod:

networks:
  sig-maps-prod-network:
    driver: bridge
