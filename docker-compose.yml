version: '3.8'

services:
  # PostgreSQL Database with PostGIS
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: sig-maps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres -c max_connections=100
               -c shared_buffers=256MB
               -c effective_cache_size=1GB
               -c work_mem=4MB
               -c maintenance_work_mem=64MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sig-maps-network

  # Redis for BullMQ (Export Jobs)
  redis:
    image: redis:7-alpine
    container_name: sig-maps-redis
    restart: unless-stopped
    command: >
      redis-server --maxmemory 256mb
                   --maxmemory-policy allkeys-lru
                   --timeout 300
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sig-maps-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sig-maps-backend-v2
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3005
    ports:
      - 3005:3005
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "sig-backend"
      tsdproxy.container_port: "3005"
      tsdproxy.funnel: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - exports_volume:/exports
      - prisma_migrations:/app/prisma/migrations
    command: >
      sh -c "npm ci --legacy-peer-deps &&
             npx prisma generate &&
             npx prisma migrate deploy &&
             npm run build &&
             npm start"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sig-maps-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sig-maps-frontend-v2
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    ports:
      - 3003:3000
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "sig-frontend"
      tsdproxy.container_port: "3003"
      tsdproxy.funnel: "true"
    depends_on:
      - backend
    command: >
      sh -c "npm ci --legacy-peer-deps &&
             npm run build &&
             npm start"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sig-maps-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sig-maps-nginx
    restart: unless-stopped
    ports:
      - 8080:80
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "sig-maps"
      tsdproxy.container_port: "8080"
      tsdproxy.funnel: "true"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - sig-maps-network

volumes:
  postgres_data:
  exports_volume:
  prisma_migrations:
  redis_data:

networks:
  sig-maps-network:
    driver: bridge
